# oslc-mcp-server configuration — copy to oslc-mcp-server.yaml and edit.
#
# The real file is git-ignored: it names a specific deployment and may carry
# credentials. This example contains no real host, project area or credential.
#
# Run with:   oslc-mcp-server --config ./oslc-mcp-server.yaml
#      or:    OSLC_CONFIG_FILE=./oslc-mcp-server.yaml oslc-mcp-server
#
# ── serviceProviders ────────────────────────────────────────────────────
# Scopes startup discovery. On an ELM application one service provider is
# one project area, and a production server may have thousands; listing the
# few you actually use turns startup from a full catalog crawl into a
# bounded set of fetches. Omit the list entirely to walk the catalog.
#
# ── catalogUrl ──────────────────────────────────────────────────────────
# Optional. When absent it is read from ${baseUrl}/rootservices, selecting
# the domain's service-providers predicate — which is why the ELM entries
# below do not need it. Falls back to ${baseUrl}/oslc/catalog for servers
# that publish no rootservices.
#
# ── configurationContext ────────────────────────────────────────────────
# Required against configuration-enabled ELM project areas: it names the
# stream or baseline requests resolve against. Without it the application
# picks a configuration for you, so a query can look right and be about the
# wrong stream.
#
# Set it at SERVER level, as below. A `configurationContext` under an
# individual serviceProvider is parsed but NOT applied -- one client serves
# the whole server entry and sends one Configuration-Context header -- and
# the server warns at startup if it finds one.
#
# It can also be set for a session with the `set_configuration_context` tool,
# which is how to work in a global configuration the user names at the time,
# or to switch between them without restarting. `get_configuration_context`
# reports what is actually being sent.
#
# ── credentials ─────────────────────────────────────────────────────────
# Prefer usernameEnv/passwordEnv, naming environment variables. Literal
# username/password also work and emit one warning at load — the file is
# git-ignored, but it still travels in pastes, backups and screen shares.

# ── oauth ───────────────────────────────────────────────────────────────
# For servers behind an OAuth 2.0 issuer, which accept no username and
# password at all — CDCM, Rhapsody Systems Engineering, and ELM
# applications fronted by a Jazz Authorization Server.
#
# This server obtains its own token with the client credentials grant. It
# does not share one with any other tool, and no token passes between them.
#
# ATTRIBUTION: a client credentials token carries no user. Every change is
# attributed to the configured client, and what it can see is what that
# service account can see -- not what you can see. Register a service
# account deliberately rather than reusing a person's client. The server
# says whose identity it is using at startup.
#
# scope is deployment-specific and has NO default: a service account's
# scope is not a user's. CDCM service integrations use `service-user-roles`;
# ELM applications behind JSA require `general` of a user token. A wrong
# scope authenticates and then fails authorization, which is harder to
# diagnose than no scope at all.
#
# Prefer clientIdEnv/clientSecretEnv over literals, for the same reason as
# usernameEnv/passwordEnv.
#
# `credentials` and `oauth` are not alternatives to be hedged between: give
# a server whichever one it actually accepts. A server with `oauth` uses it
# for every request.

# ── reportPath ──────────────────────────────────────────────────────────
# Where the discovery report is written, on every start (default
# ./oslc-discovery.md). It lists each service provider, every creation factory
# and query capability, every shape that failed to fetch, and the URL each
# generated tool will hit — the same content the `describe_discovery` tool
# returns. A file is written whether or not any client asks, because the case
# it is most wanted for is a server that started and produced the wrong tools.
# Small enough (a few hundred tokens per scoped server) to hand to an assistant
# as context for what these tools can actually do. Shown here at its default, so
# commenting it out changes nothing; point it somewhere deliberate to keep one
# under version control.

reportPath: ./oslc-discovery.md

servers:
  - alias: dng
    baseUrl: https://elm.example.com/rm
    credentials:
      usernameEnv: ELM_USER
      passwordEnv: ELM_PASSWORD
    # Server level -- a configurationContext under a serviceProvider is ignored.
    configurationContext: https://elm.example.com/gc/configuration/GC_ID
    serviceProviders:
      - uri: https://elm.example.com/rm/oslc_rm/_PROJECT_AREA_ID/services.xml
        alias: requirements

  - alias: etm
    baseUrl: https://elm.example.com/qm
    credentials:
      usernameEnv: ELM_USER
      passwordEnv: ELM_PASSWORD
    configurationContext: https://elm.example.com/gc/configuration/GC_ID
    serviceProviders:
      - uri: https://elm.example.com/qm/oslc_qm/_PROJECT_AREA_ID/services.xml
        alias: test

  - alias: ewm
    baseUrl: https://elm.example.com/ccm
    credentials:
      usernameEnv: ELM_USER
      passwordEnv: ELM_PASSWORD
    serviceProviders:
      - uri: https://elm.example.com/ccm/oslc/contexts/_PROJECT_AREA_ID/workitems/services.xml
        alias: change
    # Work items are not versioned, so no configuration context applies.

  # A server behind an OAuth 2.0 issuer, which takes no username and
  # password at all. Changes are attributed to the service account.
  # - alias: cdcm
  #   baseUrl: https://cdcm.example.com/cdcm/SPACE-KEY
  #   oauth:
  #     issuer: https://cdcm.example.com/oidc/endpoint/jazzop
  #     clientIdEnv: CDCM_CLIENT_ID
  #     clientSecretEnv: CDCM_CLIENT_SECRET
  #     scope: service-user-roles

  # A single non-ELM server needs far less: no rootservices, so the
  # ${baseUrl}/oslc/catalog convention applies, and no configuration context.
  # - alias: bmm
  #   baseUrl: http://localhost:8080
  #   credentials:
  #     usernameEnv: BMM_USER
  #     passwordEnv: BMM_PASSWORD
